name: Quest preview release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quest-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^val questVersion = "\([^"]*\)"/\1/p' android/app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v${version%-quest-dev}"
          test -f ".github/releases/$GITHUB_REF_NAME.md"
      - name: Install Android build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Run native regression tests
        run: bash scripts/test_quest_math.sh
      - name: Build signed ARM64 preview
        run: bash android/gradlew -p android assembleDebug --console=plain
      - name: Verify and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_quest_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/rechan-vr-standalone-${GITHUB_REF_NAME#v}-quest3.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quest-preview-${{ github.ref_name }}
          path: dist/
      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --verify-tag --prerelease \
            --title "ReChan VR Standalone ${GITHUB_REF_NAME#v} — Quest 3 preview" \
            --notes-file ".github/releases/$GITHUB_REF_NAME.md"
